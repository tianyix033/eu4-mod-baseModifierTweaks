l_english:
 science_of_gunnery:0 "The Science of Gunnery"
 science_of_gunnery_desc:0 "Our founders cast their pieces by eye and by habit, and their gunners aimed by the same. We will do both by number. Ranging tables and the gunner's quadrant, a settled reckoning of powder to shot, a bore true enough that the ball leaves it where the arithmetic said it would - and a barrel that carries its weight of metal where it is needed rather than everywhere, so that more of them will stand on a deck. A cannon is not a bell to be cast by a craftsman's feel. It is a problem in numbers, and we intend to solve it."
